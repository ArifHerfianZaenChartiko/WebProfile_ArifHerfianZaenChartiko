<!-- Diambil dari aset resmi Google: ssl.gstatic.com/analytics-lego/svg/
     ic_data_studio.svg — berkas yang dirujuk langsung oleh HTML
     lookerstudio.google.com, dan yang tergambar di pojok kiri atas aplikasinya.
     Warnanya karena itu warna merek apa adanya, #4285f4 dan #9aa0a6.

     BUKAN IKON TIGA BAR YANG LAMA. Versi pertama berkas ini memakai
     www.gstatic.com/analytics-suite/header/suite/v2/ic_data_studio.svg — tiga
     bar mendatar bertitik, biru #1A73E8 dan #669DF6. Berkas itu MASIH DILAYANI
     server Google dan namanya persis sama, jadi ia terbaca seperti aset yang
     benar; yang membedakan cuma path-nya (`analytics-suite/header/suite/v2`
     lawan `analytics-lego`). Ia lambang Data Studio generasi sebelumnya dan
     sudah tidak muncul di mana pun di aplikasinya.

     Pelajarannya: URL yang menjawab 200 tidak membuktikan asetnya masih
     dipakai. Ambil dari HTML halaman yang sedang tayang, bukan dari tebakan
     nama berkas.

     TIGA HAL DIBUANG DARI BERKAS ASLINYA, dan yang pertama wajib.

     1. <path fill="none" d="M0 0h512v512H0z"> SELEBAR VIEWBOX. Ia tidak
        menggambar apa pun, tapi getBBox() menghitung elemen tak berisi juga —
        terukur, dengan path itu ia melaporkan tinta 512x512 di dalam viewBox
        512x512, alias rapat sempurna. Siapa pun yang mengukur berkas ini apa
        adanya akan menyimpulkan tidak perlu diskalakan, dan logonya tampil 21%
        lebih kecil daripada tetangganya tanpa satu pun pesan galat. Tinta
        sebenarnya 404x404.

     2. width/height tidak ada di berkas aslinya, jadi tidak ada yang perlu
        dibuang — ukurannya memang sudah ditentukan CSS, seperti ikon lain di
        folder ini.

     3. Tidak ada deklarasi XML atau atribut warisan lain yang perlu dibersihkan.
        Berkasnya memang sudah ramping.

     GEOMETRI TINTANYA, buat yang perlu menghitung ulang: x 54-458, y 54-458,
     jadi 404x404 di dalam viewBox 512x512 — BUJUR SANGKAR PERSIS (rasio
     1,0000) dan simetris di kedua sumbu (sisa 54 satuan di keempat sisi). Itu
     yang membuat aturan penyamaan tinggi berlaku bersih di sini, tanpa
     perdebatan rata-rata geometrik seperti pada Claude Code. Skala 1,27
     dipasang di markup card-nya, bukan di sini; hitungannya ada di komentar
     card itu.

     Bahasa awamnya: ini berkas logo Data Studio yang diunduh langsung dari
     server Google, versi yang dipakai aplikasinya sekarang. Yang dibuang cuma
     satu kotak tak terlihat yang bikin hasil pengukuran keliru; bentuk dan
     warnanya sama persis dengan aslinya. -->
