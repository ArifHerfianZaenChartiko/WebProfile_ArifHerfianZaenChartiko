<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Judul dan deskripsi ini yang dibaca mesin pencari dan yang jadi preview
       card saat link-nya dibagikan. Peran harus tersebut di sini: di
       halaman, peran hanya muncul di dalam animasi typewriter — bagus untuk
       pembaca, tapi tidak membantu siapa pun menemukannya lewat pencarian.

       Tetap ditulis di sini, BUKAN di React. File ini yang dikirim server
       apa adanya; kalau judul dan deskripsi dipasang belakangan oleh React,
       perayap yang tidak menjalankan JavaScript tidak akan melihatnya.

       NAMA TEKNOLOGINYA DITULIS HARFIAH di deskripsi, bukan diringkas jadi
       "data analytics" saja. Penyaring lamaran dan pencarian mencocokkan teks
       apa adanya: yang dicari orang "Python", "Power BI", dan "Tableau",
       bukan kata payungnya. Deskripsinya karena itu sedikit lebih panjang
       dari 160 karakter yang ditampilkan Google — sisanya tetap terindeks,
       cuma tidak tampil.

       DAFTARNYA PERSIS ISI GRID TEKNOLOGI DAN PERKAKAS di bagian Keahlian,
       tidak lebih. Deskripsi yang menjanjikan sesuatu yang tidak ada di
       halamannya adalah cacat yang sama dengan kalimat petunjuk gallery yang
       dulu keliru.

       "SQL" MASUK pada 16 Agustus 2026, dan syaratnya memang baru terpenuhi
       hari itu. Sampai sebelumnya kata itu sengaja TIDAK ditulis di sini
       meski penyaring lamaran sering mencarinya dan PostgreSQL jelas
       mengerjakannya, sebab halaman ini belum menampilkannya sebagai entri
       sendiri. Sekarang ia punya barisnya sendiri di grid Teknologi
       ("Bahasa Kueri"), jadi deskripsi ini tidak lagi menjanjikan sesuatu
       yang tidak ada — ia menyebut apa yang benar-benar terpampang beberapa
       layar di bawah.

       Ditaruh SETELAH Python dan SEBELUM PostgreSQL, mengikuti urutan
       tampilnya di halaman. -->
  <meta name="description" content="Arif Herfian Zaen Chartiko — Data Analyst (Python, SQL, PostgreSQL, Power BI, Tableau), Pendidik Informatika, dan Staf Administrasi. Lulusan Universitas Negeri Malang.">
  <title>Arif Herfian Zaen Chartiko — Data Analyst</title>

  <meta property="og:type" content="website">
  <meta property="og:locale" content="id_ID">
  <meta property="og:title" content="Arif Herfian Zaen Chartiko — Data Analyst">
  <meta property="og:description" content="Arif Herfian Zaen Chartiko — Data Analyst (Python, SQL, PostgreSQL, Power BI, Tableau), Pendidik Informatika, dan Staf Administrasi. Lulusan Universitas Negeri Malang.">
  <meta property="og:url" content="https://webprofile-arifherfianzaenchartiko.vercel.app/">

  <!-- Preview card saat link-nya dibagikan. Sampai 9 Agustus 2026 tag ini
       tidak ada sama sekali, jadi link yang dikirim lewat WhatsApp atau
       LinkedIn tampil sebagai baris teks polos tanpa gambar — kehilangan yang
       nyata untuk portofolio yang penyebarannya justru lewat link.

       URL-NYA HARUS MUTLAK, bukan relatif. Perayap yang mengambil card ini
       tidak menjalankan halaman, jadi tidak ada basis untuk menyelesaikan
       "assets/og.png"; yang relatif diam-diam gagal dan card-nya kembali
       kosong tanpa satu pun pesan error.

       1200x630 itu ukuran yang diminta Open Graph, dan alt-nya dibaca
       screen reader di Twitter/X. File-nya dibuat dengan merender
       tools/og-template.html pada ukuran itu, bukan digambar tangan — jadi
       ia memakai warna dan tipografi yang sama persis dengan situsnya. -->
  <meta property="og:image" content="https://webprofile-arifherfianzaenchartiko.vercel.app/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Arif Herfian Zaen Chartiko — Data Analyst, Pendidik Informatika, Staf Administrasi">
  <meta name="twitter:card" content="summary_large_image">

  <!-- SVG, bukan .ico: satu file yang tajam di semua ukuran, dan ia monogram
       yang sama dengan panel intro. Kalau BENTUKNYA diubah, ubah keduanya —
       heksagon pembingkainya dibuang di kedua tempat pada 15 Agustus 2026.

       UKURANNYA boleh berbeda, dan memang berbeda: di panel intro tandanya
       dibiarkan seukuran semula di dalam viewBox yang longgar, di sini ia
       diskalakan mengisi petaknya. Alasannya ada di komentar favicon.svg
       sendiri, dan singkatnya: panel intro hitam sepenuh layar sehingga ruang
       kosong tidak terlihat, sedangkan favicon punya tepi yang kelihatan.

       Berkasnya 3,4 KB, bukan 700 byte seperti yang dulu tertulis di sini —
       angka itu sudah keliru bahkan sebelum perubahan ini (file lamanya
       1,3 KB). Hampir seluruhnya komentar, dan komentar di public/ TIDAK
       dibuang saat build: isinya disalin apa adanya ke dist. Itu ongkos yang
       diterima dengan sadar — satu permintaan yang di-cache peramban, ditukar
       dengan geometri yang terdokumentasi di tempat ia dipakai. Kalau suatu
       saat ukuran berkas ini jadi penting, yang dipangkas komentarnya, bukan
       ketelitian angkanya. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- TIDAK ADA SATU PUN TAG LINK KE HOST LUAR DI SINI, dan itu disengaja.

       Kata "link" di komentar ini sengaja tidak ditulis sebagai tag sungguhan.
       Sempat begitu, dan akibatnya `grep '<link'` pada halaman hasil build
       melaporkan empat tag yang sebenarnya cuma prosa — cukup untuk membuat
       pemeriksaan "masih ada rujukan ke host luar?" terbaca gagal padahal
       lolos.

       Dua keluarga saja dipakai: Inter untuk seluruh teks DAN judul, JetBrains
       Mono untuk label kecil berspasi lebar. Keduanya diimpor dari
       src/main.jsx sebagai paket npm @fontsource, sama seperti Font Awesome,
       supaya ikut dibundel Vite dan dilayani dari domain sendiri.

       Sampai 15 Agustus 2026 di sinilah berdiri tiga tag link ke
       fonts.googleapis.com dan fonts.gstatic.com. Ketiganya dibuang: yang
       terakhir itu tag link di head sehingga MEMBLOKIR render sampai
       permintaan ke host asing selesai, ia titik gagal tunggal, dan ia
       mengirimkan alamat IP tiap pengunjung ke Google. Alasan lengkapnya ada
       di src/main.jsx.

       JANGAN KEMBALIKAN tag link ke fonts.googleapis.com maupun ke cdnjs.
       Content-Security-Policy di vercel.json sekarang berbunyi
       `default-src 'self'` tanpa satu pun host luar — mengembalikan salah
       satunya berarti fontnya diblokir peramban tanpa pesan apa pun di
       halaman, dan yang terlihat cuma huruf yang tiba-tiba berganti bentuk. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
