<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Judul dan deskripsi ini yang dibaca mesin pencari dan yang jadi preview
       card saat link-nya dibagikan. Peran harus tersebut di sini: di
       halaman, peran hanya muncul di dalam animasi typewriter — bagus untuk
       pembaca, tapi tidak membantu siapa pun menemukannya lewat pencarian.

       Tetap ditulis di sini, BUKAN di React. File ini yang dikirim server
       apa adanya; kalau judul dan deskripsi dipasang belakangan oleh React,
       perayap yang tidak menjalankan JavaScript tidak akan melihatnya.

       NAMA TEKNOLOGINYA DITULIS HARFIAH di deskripsi, bukan diringkas jadi
       "fullstack" saja. Penyaring lamaran dan pencarian mencocokkan teks apa
       adanya: yang dicari orang "Laravel" dan "MySQL", bukan kata payungnya.
       Deskripsinya karena itu sedikit lebih panjang dari 160 karakter yang
       ditampilkan Google — sisanya tetap terindeks, cuma tidak tampil. -->
  <meta name="description" content="Arif Herfian Zaen Chartiko — Fullstack Web Developer (HTML, CSS, JavaScript, PHP, Laravel, Blade, MySQL), Pendidik Informatika, dan Staf Administrasi. Lulusan Universitas Negeri Malang.">
  <title>Arif Herfian Zaen Chartiko — Fullstack Web Developer</title>

  <meta property="og:type" content="website">
  <meta property="og:locale" content="id_ID">
  <meta property="og:title" content="Arif Herfian Zaen Chartiko — Fullstack Web Developer">
  <meta property="og:description" content="Arif Herfian Zaen Chartiko — Fullstack Web Developer (HTML, CSS, JavaScript, PHP, Laravel, Blade, MySQL), Pendidik Informatika, dan Staf Administrasi. Lulusan Universitas Negeri Malang.">
  <meta property="og:url" content="https://webprofile-arifherfianzaenchartiko.vercel.app/">

  <!-- Preview card saat link-nya dibagikan. Sampai 9 Agustus 2026 tag ini
       tidak ada sama sekali, jadi link yang dikirim lewat WhatsApp atau
       LinkedIn tampil sebagai baris teks polos tanpa gambar — kehilangan yang
       nyata untuk portofolio yang penyebarannya justru lewat link.

       URL-NYA HARUS MUTLAK, bukan relatif. Perayap yang mengambil card ini
       tidak menjalankan halaman, jadi tidak ada basis untuk menyelesaikan
       "assets/og.png"; yang relatif diam-diam gagal dan card-nya kembali
       kosong tanpa satu pun pesan error.

       1200x630 itu ukuran yang diminta Open Graph, dan alt-nya dibaca
       screen reader di Twitter/X. File-nya dibuat dengan merender
       tools/og-template.html pada ukuran itu, bukan digambar tangan — jadi
       ia memakai warna dan tipografi yang sama persis dengan situsnya. -->
  <meta property="og:image" content="https://webprofile-arifherfianzaenchartiko.vercel.app/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Arif Herfian Zaen Chartiko — Fullstack Web Developer, Pendidik Informatika, Staf Administrasi">
  <meta name="twitter:card" content="summary_large_image">

  <!-- SVG, bukan .ico: satu file 700 byte yang tajam di semua ukuran, dan
       ia monogram yang sama dengan panel intro. Kalau salah satu diubah,
       ubah keduanya. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Dua keluarga saja. Inter untuk seluruh teks DAN judul; JetBrains Mono
       untuk label kecil berspasi lebar. Dulu Fraunces ikut dimuat sebagai
       serif judul, tapi tidak pernah benar-benar dipasang — --font-display
       menunjuk ke Inter — jadi 356 KB ter-download tanpa pernah tampil.

       Bobotnya juga dipangkas ke yang benar-benar dipakai: Inter 400 dan 500
       (font-medium), JetBrains Mono 400. Halaman ini tidak punya satu pun
       <strong> atau <em>, dan tidak memakai class bobot selain font-medium,
       jadi 300/600/700/800 cuma menambah unduhan tanpa mengubah apa pun di
       screen. Beban font: 731 KB -> 115 KB.

       Tanda & ditulis &amp; karena di HTML & mengawali entitas; tanpa itu
       "&family" bisa terbaca sebagai entitas yang tidak dikenal. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">

  <!-- Font Awesome TIDAK lagi dimuat di sini. Ia diimpor dari src/main.jsx
       supaya ikut dibundel Vite dan dilayani dari domain sendiri; alasan
       lengkapnya ada di file itu. Jangan kembalikan <link> ke cdnjs. -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
