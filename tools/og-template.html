<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════════════════
     TEMPLAT KARTU PRATINJAU. BUKAN halaman situs, dan tidak ikut dibundel
     Vite — ia berada di luar src/ dan public/ justru supaya tidak ikut
     terbit.

     Yang dipakai situs adalah HASIL RENDER-nya: public/assets/og.png, yang
     dirujuk <meta property="og:image"> di index.html. Berkas ini sumbernya.

     CARA MEMPERBARUI: buka berkas ini di peramban, tangkap layar seluruh
     <body> pada 1200x630 — itu ukuran yang diminta Open Graph dan sudah
     dipatok di CSS bawah — lalu timpa public/assets/og.png.

     BISA JUGA TANPA MEMBUKA PERAMBAN, lewat Chrome headless. Perintah
     lengkapnya ada di README, bagian "Kartu pratinjau (OG image)" —
     sengaja ditaruh di sana, bukan di sini, karena flag Chrome diawali dua
     tanda hubung dan rangkaian itu tidak sah di dalam komentar HTML.

     Dua flag di antaranya WAJIB, dan alasannya ditulis di README juga: satu
     mengunci skala layar supaya hasilnya benar 1200x630 dan bukan dua kali
     lipat di layar HiDPI, satu lagi menunggu Google Fonts selesai dimuat.
     Tanpa yang kedua, tangkapannya jadi dengan font cadangan sistem — yang
     keluar bukan galat, melainkan kartu yang hurufnya meleset dari situsnya.
     Persis jenis kesalahan yang tidak ketahuan sampai ada yang membagikan
     link-nya.

     TERAKHIR DIRENDER 14 Agustus 2026, waktu peran utama berganti dari
     "Fullstack Web Developer" ke "Data Analyst". Hasilnya diadu piksel
     dengan berkas lama: identik di seluruh bidang kecuali badge pertama.

     KENAPA TEMPLAT, BUKAN GAMBAR YANG DIGAMBAR TERPISAH. Warna, font, dan
     monogramnya di sini disalin dari situsnya (#040508, #d8d8d8, #ff6a3d,
     Inter + JetBrains Mono, viewBox 176x168 yang sama dengan panel pembuka).
     Kalau situsnya berubah, yang perlu dikerjakan cuma menyamakan nilai di
     bawah lalu merender ulang — bukan menggambar ulang dari nol dengan
     warna yang bisa diam-diam meleset.

     Sampai 9 Agustus 2026 berkas ini bernama docs/og.html. Dipindah ke sini
     karena ia bukan dokumen: ia aset yang kebetulan berbentuk HTML, dan
     nama foldernya yang lama membuat perannya salah terbaca.
     ═══════════════════════════════════════════════════════════════════════ -->
<html lang="id">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box }
  body {
    width: 1200px; height: 630px;
    background: #040508;
    color: #d8d8d8;
    font-family: "Inter", sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px;
    overflow: hidden;
  }
  .atas { display: flex; align-items: center; gap: 22px }
  .atas svg { width: 58px; height: auto }
  .kode {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px; letter-spacing: .18em; text-transform: uppercase;
    color: #808080;
  }
  h1 {
    font-size: 92px; font-weight: 500; line-height: .96; letter-spacing: -.04em;
  }
  h1 span { color: #808080 }
  .garis { height: 1px; background: #434343; margin: 34px 0 26px }
  .peran { display: flex; gap: 14px; flex-wrap: wrap }
  .peran span {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
    color: #808080; border: 1px solid #2a2a2a; padding: 10px 16px;
  }
  .bawah { display: flex; align-items: baseline; justify-content: space-between }
  .titik { width: 9px; height: 9px; border-radius: 999px; background: #ff6a3d; display: inline-block; margin-right: 12px }
</style>
</head>
<body>
  <div class="atas">
    <svg viewBox="0 0 176 168" aria-hidden="true">
      <g fill="none" stroke="#d8d8d8" stroke-linecap="butt" stroke-linejoin="miter">
        <g stroke-width="5">
          <path d="M 88 6 L 158 46 L 158 122 L 88 162"/>
          <path d="M 88 6 L 18 46 L 18 122 L 88 162"/>
        </g>
        <g stroke-width="14">
          <path d="M 48 132 L 48 84 L 88 40 L 128 84 L 128 132"/>
          <path d="M 48 106 L 128 106"/>
        </g>
      </g>
    </svg>
    <span class="kode">Portofolio</span>
  </div>

  <div>
    <h1>Arif Herfian<br><span>Zaen Chartiko</span></h1>
    <div class="garis"></div>
    <div class="peran">
      <span>Data Analyst</span>
      <span>Pendidik Informatika</span>
      <span>Staf Administrasi</span>
    </div>
  </div>

  <div class="bawah">
    <span class="kode"><i class="titik"></i>Kab. Blitar, Jawa Timur</span>
    <span class="kode">S1 Pendidikan Teknik Informatika &middot; UM</span>
  </div>
</body>
</html>
